ho<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cipher ruler — print</title>
<style>
/* A4 landscape. Each row = one alphabet, cell width fills the page. Rows come in touching pairs; pairs are spaced apart. */
@page { size: A4 landscape; margin: 6mm; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #000; }
.page { width: 285mm; margin: 0 auto; }
header { display: flex; gap: 4mm; align-items: center; height: 10mm; font-size: 10pt; }
header span { flex: 1; }
header select, header button { font: inherit; padding: 2px 10px; }
.pair { margin-bottom: var(--gap); border-top: 0.3mm dashed #000; border-bottom: 0.3mm dashed #000; }
.row { display: grid; grid-template-columns: repeat(var(--n), 1fr); height: var(--h); }
.row + .row { border-top: 0.3mm dashed #000; }
.row span { display: flex; align-items: center; justify-content: center; font: 700 var(--f)/1 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; border-left: 0.2mm solid #999; }
.row span:nth-child(1) { border-left: 0; }
@media print { header { display: none; } body { -webkit-print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <span>Cut along dashed lines. Slide a strip by the key. / Разрежь по линиям, сдвинь полоску на ключ.</span>
    <select id="lang">
      <option value="ru">Русский</option>
      <option value="et">Eesti</option>
      <option value="en">English</option>
    </select>
    <button type="button" onclick="print()">Print / Печать</button>
  </header>
  <div id="rows"></div>
</div>
<script>
const ABC = {
  ru: 'абвгдежзийклмнопрстуфхцчшщъыьэюя',
  et: 'abcdefghijklmnopqrsšzžtuvwõäöüxy',
  en: 'abcdefghijklmnopqrstuvwxyz',
};
const PAGE_W = 285, PAGE_H = 198 - 10; // mm: A4 landscape minus margins, minus header
const sel = document.getElementById('lang');
function render() {
  const abc = ABC[sel.value], n = abc.length, gap = 6;
  const cell = PAGE_W / n, h = cell * 1.3;       // row height just fits a letter; extra pairs instead of bigger letters
  const pairs = Math.floor((PAGE_H + gap) / (2 * h + gap));
  const r = document.documentElement.style;
  r.setProperty('--n', n); r.setProperty('--h', h + 'mm'); r.setProperty('--f', cell * 0.8 + 'mm'); r.setProperty('--gap', gap + 'mm');
  document.documentElement.lang = sel.value;
  const row = '<div class="row">' + [...abc].map(c => `<span>${c}</span>`).join('') + '</div>';
  document.getElementById('rows').innerHTML = ('<div class="pair">' + row + row + '</div>').repeat(pairs);
  history.replaceState(null, '', '?lang=' + sel.value);
}
sel.value = new URLSearchParams(location.search).get('lang') in ABC ? new URLSearchParams(location.search).get('lang') : 'ru';
sel.onchange = render;
render();
</script>
</body>
</html>
