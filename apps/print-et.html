<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>Шифровальная линейка (эстонский алфавит) — печать</title>
<style>
/* A4 альбомная; 64 клетки = алфавит дважды, чтобы при сдвиге строки не обрывались (после «я» снова «а») */
@page { size: A4 landscape; margin: 6mm; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #000; }
.page { --cell: calc(285mm / 64); width: 285mm; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: baseline; margin: 2mm 0 5mm; font-size: 11pt; }
header b { font-size: 14pt; }
header button { font: inherit; padding: 4px 12px; }
.tool { margin-bottom: 14mm; border-top: 0.4mm dashed #000; border-bottom: 0.4mm dashed #000; padding: 1.2mm 0; }
.row { display: grid; grid-template-columns: repeat(64, var(--cell)); height: 14mm; }
.row + .row { border-top: 0.4mm dashed #000; margin-top: 1.2mm; padding-top: 1.2mm; height: calc(14mm + 1.6mm); }
.row span { display: flex; align-items: center; justify-content: center; font: 700 7mm/1 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; border-left: 0.2mm solid #999; }
.row span:nth-child(32n+1) { border-left: 0.5mm solid #000; }
@media print { header button { display: none; } body { -webkit-print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <span><b>Шифровальная линейка · эстонский алфавит.</b> Разрежь по пунктирным линиям. Сдвинь нижнюю полоску влево или вправо на ключ — верхняя буква превратится в нижнюю.</span>
    <button type="button" onclick="print()">Печать</button>
  </header>
  <div id="tools"></div>
</div>
<script>
const abc = 'abcdefghijklmnopqrsšzžtuvwõäöüxy';
const row = () => '<div class="row">' + [...abc + abc].map(c => `<span>${c}</span>`).join('') + '</div>';
document.getElementById('tools').innerHTML = Array(3).fill('<div class="tool">' + row() + row() + '</div>').join('');
</script>
</body>
</html>
