<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея формул</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script>["embed","light"].forEach(function(k){if(new RegExp("[?&]"+k+"\\b").test(location.search))document.documentElement.classList.add(k)})</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* сброс, который раньше добавляла оболочка артефакта */
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}

/* Layout: ночной осциллограф — один большой светящийся экран для проектора, рядом карточка с формулой и подсказкой учителю */
:root{
  --ink:#0b1220; --panel:#121b2e; --grid:#18243b; --line:#2a3a5c;
  --fg:#e8eefc; --muted:#93a4c8;
  --gold:#ff7ac6; --rose:#ff8a5c; --sky:#5cc8ff; --leaf:#7ee08f;
  --display:"Unbounded","Trebuchet MS",sans-serif;
  --body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html.light{
  --ink:#ffffff; --panel:#f3f6fb; --panel2:#e6edf7; --grid:#dde5f1; --line:#b8c5dc;
  --fg:#0f1b33; --muted:#4b5b78;
  --gold:#9d1469; --rose:#c2410c; --sky:#0b6fa8; --leaf:#1b7f3a; --hl:#f6d3e6;
  color-scheme:light;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 32px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.2vw,34px);margin:0;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:0;max-width:60ch}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
nav button{flex:none;font:600 15px var(--body);color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button:hover{color:var(--fg);border-color:var(--muted)}
nav button[aria-selected="true"]{color:var(--ink);background:var(--gold);border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
@media (max-width:880px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--ink);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;height:min(72vh,740px);min-height:340px}
.stage:fullscreen{border-radius:0;height:100%}
canvas{display:block;width:100%;height:100%}
.badge{position:absolute;left:16px;bottom:14px;font-family:var(--display);font-weight:500;
  font-size:clamp(15px,2vw,22px);color:var(--fg);pointer-events:none;text-shadow:0 0 12px var(--ink)}
.badge small{display:block;font-family:var(--mono);font-size:.62em;color:var(--muted);font-weight:400}
.fs{position:absolute;top:10px;right:10px;font:600 13px var(--body);color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.fs:hover{color:var(--fg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
  display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.formula{font-family:var(--mono);font-size:14px;line-height:1.6;color:var(--gold);background:var(--ink);
  border-radius:8px;padding:10px 12px;margin:0;overflow-x:auto;white-space:pre}
.say{margin:0}
.ctl{display:flex;flex-direction:column;gap:12px}
.ctl label{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;color:var(--muted)}
.ctl output{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ctl button{font:600 14px var(--body);color:var(--fg);background:var(--line);border:0;border-radius:8px;
  padding:9px 14px;cursor:pointer}
.ctl button:hover{filter:brightness(1.2)}
.ctl button.on{background:var(--gold);color:var(--ink)}
.stat{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0;min-height:1.5em}
.tip{margin:0;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.tip b{display:block;color:var(--fg);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-bottom:2px}

/* режим для вставки в слайды: ?embed — без шапки и вкладок, компактные отступы */
.embed header,.embed nav{display:none}
.embed body{padding-block:10px}
.embed .wrap{gap:10px}
.embed .panel{gap:10px}
.embed .card{padding:14px;gap:10px}
.embed textarea{min-height:64px}
.embed h2{font-size:17px}
.embed #p-break{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:10px}
.embed #p-break>.card:nth-child(1){grid-column:1;grid-row:1}
.embed #p-break>.card:nth-child(2){grid-column:2;grid-row:1/span 2}
.embed #p-break>.card:nth-child(3){grid-column:1;grid-row:2}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Галерея <span>формул</span></h1>
    <p class="sub">Каждая картинка — это просто правило, по которому компьютер ставит точки (x; y).</p>
  </header>
  <nav id="tabs" role="tablist" aria-label="Графики"></nav>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Рисунок графика"></canvas>
      <div class="badge" id="badge"></div>
      <button class="fs" id="fs" type="button">На весь экран</button>
    </div>
    <aside class="card">
      <h2 id="title"></h2>
      <pre class="formula" id="formula"></pre>
      <p class="say" id="say"></p>
      <div class="ctl" id="ctl"></div>
      <p class="stat" id="stat"></p>
    </aside>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const cs=getComputedStyle(document.documentElement);
const C={};['ink','panel','grid','line','fg','muted','gold','rose','sky','leaf'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,cur=null,curKey='';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO='"JetBrains Mono", ui-monospace, monospace';

function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,r.width);H=Math.max(1,r.height);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(cur&&cur.resize)cur.resize();
}
new ResizeObserver(resize).observe(cv);

function clear(){ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H)}
function paper(step){
  ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
  for(let x=(W/2)%step;x<W;x+=step){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H)}
  for(let y=(H/2)%step;y<H;y+=step){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5)}
  ctx.stroke();
}
function glow(color,w,blur){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.shadowColor=color;ctx.shadowBlur=blur==null?14:blur;ctx.lineJoin='round';ctx.lineCap='round'}
function fitR(R,xmin,xmax,ymin,ymax,pad){
  pad=pad==null?44:pad;
  const s=Math.max(1e-6,Math.min((R.w-2*pad)/(xmax-xmin),(R.h-2*pad)/(ymax-ymin)));
  const cx=R.x+R.w/2-s*(xmin+xmax)/2,cy=R.y+R.h/2+s*(ymin+ymax)/2;
  return{s,X:x=>cx+s*x,Y:y=>cy-s*y,ix:px=>(px-cx)/s,iy:py=>(cy-py)/s};
}
function fit(xmin,xmax,ymin,ymax,pad){return fitR({x:0,y:0,w:W,h:H},xmin,xmax,ymin,ymax,pad)}
function pal(t){ // ink → blue → sky → gold → cream
  const st=[[11,18,32],[40,90,170],[92,200,255],[255,184,77],[255,244,220]];
  t=Math.max(0,Math.min(.9999,t))*(st.length-1);const i=Math.floor(t),u=t-i,a=st[i],b=st[i+1];
  return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]}
function mix(c1,c2,u){const h=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const a=h(c1),b=h(c2);return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*u)).join(',')+')'}
function grad3(u){return u<.5?mix(C.gold,C.rose,u*2):mix(C.rose,C.sky,(u-.5)*2)}
function dot(x,y,r,color){ctx.shadowBlur=10;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0}
function curve(f,fn,t0,t1,n){ctx.beginPath();for(let i=0;i<=n;i++){const t=t0+(t1-t0)*i/n,p=fn(t);i?ctx.lineTo(f.X(p[0]),f.Y(p[1])):ctx.moveTo(f.X(p[0]),f.Y(p[1]))}}
function offscreen(){const o=document.createElement('canvas');o.width=Math.max(1,Math.round(W*DPR));o.height=Math.max(1,Math.round(H*DPR));const c=o.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle=C.ink;c.fillRect(0,0,W,H);return{o,c}}

/* ---------- controls ---------- */
const ctlBox=$('#ctl'),statBox=$('#stat');
function slider(id,label,min,max,step,val,on){
  const l=document.createElement('label');
  l.innerHTML='<span>'+label+'</span><output id="'+id+'-o">'+val+'</output><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">';
  const i=l.querySelector('input'),o=l.querySelector('output');
  i.addEventListener('input',()=>{o.textContent=i.value;on(+i.value)});
  return l;
}
function btn(text,on,cls){const b=document.createElement('button');b.type='button';b.textContent=text;if(cls)b.className=cls;b.addEventListener('click',()=>on(b));return b}
function row(){const d=document.createElement('div');d.className='row';for(const e of arguments)d.appendChild(e);return d}
function group(items,active,on){ // toggle group
  const bs=items.map(([k,t])=>btn(t,()=>{bs.forEach(x=>x.classList.toggle('on',x===b(k)));on(k)}));
  function b(k){return bs[items.findIndex(i=>i[0]===k)]}
  b(active).classList.add('on');return row(...bs);
}

/* ---------- views ---------- */
const V={};

V.heart={tab:'Сердце',title:'Сердце из формулы',
  formula:'x = 16 · sin³ t\ny = 13 · cos t − 5 · cos 2t\n      − 2 · cos 3t − cos 4t',
  badge:'Сердце<small>t от 0 до 6,28</small>',
  say:'Две «машины» по очереди выдают x и y для каждого t. Компьютер ставит 600 точек и соединяет их.',
  tip:'Спросите: «Кто это нарисовал?» Ответ: формула. Нажмите «Нарисовать снова» и проговорите: каждая точка — пара чисел (x; y).',
  enter(){this.p=reduce?1:0},
  setup(){ctlBox.append(row(btn('Нарисовать снова',()=>this.p=0)))},
  frame(dt){
    this.p=Math.min(1,this.p+dt/3.5);clear();paper(32);
    const f=fit(-18,18,-17,13),fn=t=>[16*Math.pow(Math.sin(t),3),13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)];
    const T=Math.PI*2*this.p;curve(f,fn,0,T,Math.max(2,Math.round(600*this.p)));
    if(this.p>=1){ctx.globalAlpha=.16;ctx.fillStyle=C.rose;ctx.fill();ctx.globalAlpha=1}
    glow(C.rose,3.5);ctx.stroke();ctx.shadowBlur=0;
    const h=fn(T);dot(f.X(h[0]),f.Y(h[1]),6,C.gold);
    statBox.textContent='t = '+T.toFixed(2)+'   точка ('+h[0].toFixed(1)+'; '+h[1].toFixed(1)+')';
  }};

V.rose={tab:'Роза',title:'Цветок-роза',
  formula:'r = cos(k · угол)\nr — расстояние от центра',
  badge:'Роза',
  say:'Точка крутится вокруг центра и то отходит, то возвращается. Меняйте k — меняется число лепестков.',
  tip:'Игра: пусть класс угадает, сколько лепестков будет при k = 4 и k = 5. Нечётное k даёт k лепестков, чётное — вдвое больше.',
  enter(){this.k=this.k||5;this.d=this.d||1;this.p=reduce?1:0},
  setup(){
    ctlBox.append(slider('rk','k — число в формуле',1,9,1,this.k,v=>{this.k=v;this.p=reduce?1:0}));
    ctlBox.append(slider('rd','делитель (для дробных k)',1,5,1,this.d,v=>{this.d=v;this.p=reduce?1:0}));
    ctlBox.append(row(btn('Нарисовать снова',()=>this.p=0)));
  },
  frame(dt){
    this.p=Math.min(1,this.p+dt/3.5);clear();paper(32);
    const k=this.k/this.d,f=fit(-1.1,1.1,-1.1,1.1),T=Math.PI*2*this.d*this.p;
    const fn=t=>{const r=Math.cos(k*t);return[r*Math.cos(t),r*Math.sin(t)]};
    curve(f,fn,0,T,Math.max(2,Math.round(1400*this.d*this.p)));
    glow(C.gold,3);ctx.stroke();ctx.shadowBlur=0;
    const h=fn(T);dot(f.X(h[0]),f.Y(h[1]),6,C.rose);
    let msg='k = '+(this.d>1?this.k+'/'+this.d:this.k);
    if(this.d===1)msg+='   лепестков: '+(this.k%2?this.k:2*this.k);
    statBox.textContent=msg;
  }};

V.liss={tab:'Лиссажу',title:'Фигуры Лиссажу',
  formula:'x = sin(a · t + сдвиг)\ny = sin(b · t)',
  badge:'Две качели',
  say:'Одна качель ходит влево-вправо, другая вверх-вниз. Точка повторяет обе сразу и рисует узор.',
  tip:'Дайте детям выбрать числа: 1 и 1 — круг или овал, 1 и 2 — восьмёрка, 3 и 2 — бантик. Голубые точки на краях — это сами качели.',
  enter(){this.a=this.a||3;this.b=this.b||2;this.ph=this.ph||0;this.t=0;this.run=this.run==null?!reduce:this.run},
  setup(){
    ctlBox.append(slider('la','a — скорость качели влево-вправо',1,7,1,this.a,v=>this.a=v));
    ctlBox.append(slider('lb','b — скорость качели вверх-вниз',1,7,1,this.b,v=>this.b=v));
    ctlBox.append(row(btn(this.run?'Пауза':'Пустить',b=>{this.run=!this.run;b.textContent=this.run?'Пауза':'Пустить'})));
  },
  frame(dt){
    if(this.run){this.ph+=dt*.5;this.t+=dt*1.2}
    clear();paper(32);
    const f=fit(-1.15,1.15,-1.15,1.15,56),a=this.a,b=this.b,ph=this.ph;
    const fn=t=>[Math.sin(a*t+ph),Math.sin(b*t)];
    curve(f,fn,0,Math.PI*2,1600);glow(C.gold,2.6);ctx.stroke();ctx.shadowBlur=0;
    const p=fn(this.t);
    // качели на краях
    ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.beginPath();
    ctx.moveTo(f.X(p[0]),f.Y(p[1]));ctx.lineTo(f.X(p[0]),f.Y(-1.15));
    ctx.moveTo(f.X(p[0]),f.Y(p[1]));ctx.lineTo(f.X(-1.15),f.Y(p[1]));ctx.stroke();ctx.setLineDash([]);
    dot(f.X(p[0]),f.Y(-1.15),6,C.sky);dot(f.X(-1.15),f.Y(p[1]),6,C.sky);
    dot(f.X(p[0]),f.Y(p[1]),7,C.rose);
    statBox.textContent='a : b = '+a+' : '+b;
  }};

V.lines={tab:'Встреча на лестнице',title:'Встреча на лестнице',
  formula:'Аня:  y = x + 1\nПетя: y = 7 − x\nx — минута, y — ступенька',
  badge:'Точка пересечения',
  say:'Аня поднимается по лестнице башни, Петя спускается. Каждую минуту отмечаем на графике, на какой они ступеньке. Где линии встретились, там встретились и ребята.',
  tip:'Нажмите «Пауза» на 2-й минуте и спросите: «Когда и на какой ступеньке они встретятся?» Ответ: на 3-й минуте, на 4-й ступеньке, точка (3; 4). Режим «Кривая» показывает y = x · x.',
  enter(){this.mode=this.mode||'meet';this.restart()},
  restart(){this.t=reduce?5:0;this.hold=0;this.met=reduce;this.walk=0;this.p=reduce?99:0;this.run=true;if(this.pb)this.pb.textContent='Пауза'},
  setup(){
    ctlBox.append(group([['meet','Лестница и прямые'],['parab','Кривая y = x · x']],this.mode,k=>{this.mode=k;this.restart()}));
    this.pb=btn('Пауза',b=>{this.run=!this.run;b.textContent=this.run?'Пауза':'Дальше'});
    ctlBox.append(row(btn('Сначала',()=>this.restart()),this.pb));
  },
  axes(f,x0,x1,y0,y1,lx,ly){
    ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
    for(let x=Math.ceil(x0);x<=x1;x++){ctx.moveTo(f.X(x),f.Y(y0));ctx.lineTo(f.X(x),f.Y(y1))}
    for(let y=Math.ceil(y0);y<=y1;y++){ctx.moveTo(f.X(x0),f.Y(y));ctx.lineTo(f.X(x1),f.Y(y))}
    ctx.stroke();
    ctx.strokeStyle=C.muted;ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(f.X(x0),f.Y(0));ctx.lineTo(f.X(x1),f.Y(0));ctx.moveTo(f.X(0),f.Y(y0));ctx.lineTo(f.X(0),f.Y(y1));ctx.stroke();
    ctx.fillStyle=C.muted;ctx.font='12px '+MONO;ctx.textAlign='center';ctx.textBaseline='top';
    for(let x=Math.ceil(x0);x<=x1;x++)if(x)ctx.fillText(x,f.X(x),f.Y(0)+5);
    ctx.textAlign='right';ctx.textBaseline='middle';
    for(let y=Math.ceil(y0);y<=y1;y++)if(y)ctx.fillText(y,f.X(0)-6,f.Y(y));
    ctx.fillStyle=C.fg;ctx.font='600 13px '+MONO;ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillText(lx||'x',f.X(x1),f.Y(0)-6);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(ly||'y',f.X(0)+8,f.Y(y1));
  },
  label(f,x,y,text,color,dx,dy){ctx.fillStyle=color;ctx.font='600 13px '+MONO;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,f.X(x)+(dx||10),f.Y(y)+(dy||-12))},
  stick(x,y,s,color,phase,dir,moving){ // x,y — точка у ног (px), s — px на ступеньку
    const sw=moving?Math.sin(phase)*.28:0,lift=moving?Math.abs(Math.sin(phase))*.05:0;
    const hip=[x,y-.62*s-lift*s],sh=[x,y-1.08*s-lift*s],head=[x+.03*s*dir,y-1.28*s-lift*s];
    ctx.shadowColor=color;ctx.shadowBlur=10;ctx.strokeStyle=color;ctx.lineWidth=Math.max(2.5,s*.07);ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(hip[0],hip[1]);ctx.lineTo(x+sw*s*.6,y);ctx.moveTo(hip[0],hip[1]);ctx.lineTo(x-sw*s*.6,y);
    ctx.moveTo(hip[0],hip[1]);ctx.lineTo(sh[0],sh[1]);
    ctx.moveTo(sh[0],sh[1]+.05*s);ctx.lineTo(x-sw*s*.5+.06*s*dir,sh[1]+.42*s);
    ctx.moveTo(sh[0],sh[1]+.05*s);ctx.lineTo(x+sw*s*.5+.06*s*dir,sh[1]+.42*s);
    ctx.stroke();
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(head[0],head[1],.17*s,0,7);ctx.fill();ctx.shadowBlur=0;
  },
  frame(dt){
    clear();
    if(this.mode==='parab'){
      if(this.run)this.p+=dt/0.7;const s=Math.floor(this.p);
      const f=fit(-3.6,3.8,-0.8,10.2,36);this.axes(f,-3.4,3.6,-0.5,10);
      const pts=[0,1,2,3].map(x=>[x,x*x]);
      if(s>=5){glow(C.gold,3);curve(f,t=>[t,t*t],0,3.15,120);ctx.stroke();ctx.shadowBlur=0}
      if(s>=6){ctx.globalAlpha=.55;glow(C.gold,2,0);ctx.setLineDash([6,7]);curve(f,t=>[t,t*t],-3.15,0,120);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
        this.label(f,-3,9,'зеркальная половинка',C.muted,14,0)}
      pts.forEach((q,i)=>{if(s>i){dot(f.X(q[0]),f.Y(q[1]),5,C.rose);this.label(f,q[0],q[1],'('+q[0]+'; '+q[1]+')',C.fg)}});
      statBox.textContent=s<4?'точки по таблице: '+Math.min(s,4)+' из 4':'это не прямая, а кривая-«чаша» (парабола)';
      return;
    }
    // время
    let moving=false;
    if(this.run){
      if(this.hold>0)this.hold-=dt;
      else if(this.t<5){const nt=this.t+dt*.5;if(!this.met&&nt>=3){this.t=3;this.met=true;this.hold=2}else{this.t=Math.min(5,nt);moving=true}}
    }
    if(moving)this.walk+=dt*7;
    const t=this.t,ya=t+1,yp=7-t;
    // раскладка: лестница + график
    const wide=W>H*1.15,A=wide?{x:0,y:0,w:W*.5,h:H}:{x:0,y:0,w:W,h:H*.5},B=wide?{x:W*.5,y:0,w:W*.5,h:H}:{x:0,y:H*.5,w:W,h:H*.5};
    // ---- лестница (вид сбоку) ----
    const N=8,fs=fitR(A,-.4,N+1.4,-.6,N+1.6,24);
    ctx.beginPath();ctx.moveTo(fs.X(0),fs.Y(0));
    for(let k=0;k<=N;k++){ctx.lineTo(fs.X(k),fs.Y(k));ctx.lineTo(fs.X(k+1),fs.Y(k))}
    ctx.lineTo(fs.X(N+1),fs.Y(0));ctx.closePath();
    ctx.fillStyle=C.panel;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=C.muted;ctx.font='12px '+MONO;ctx.textAlign='center';ctx.textBaseline='top';
    for(let k=1;k<=N;k++)ctx.fillText(k,fs.X(k+.5),fs.Y(k)+4);
    ctx.textAlign='left';ctx.fillText('ступеньки башни',fs.X(-.2),fs.Y(N+1.4));
    const ease=u=>u<.55?0:(u=(u-.55)/.45,u*u*(3-2*u));
    const hAt=y=>Math.floor(y)+ease(y-Math.floor(y));
    const place=(y,off)=>[fs.X(y+.5+off),fs.Y(Math.min(N,hAt(y)))];
    const pa=place(ya,-.18),pp=place(yp,.18);
    this.stick(pa[0],pa[1],fs.s,C.sky,this.walk,1,moving);
    this.stick(pp[0],pp[1],fs.s,C.rose,this.walk+1.6,-1,moving);
    ctx.font='600 13px '+MONO;ctx.textBaseline='bottom';ctx.textAlign='center';
    ctx.fillStyle=C.sky;ctx.fillText('Аня ↑',pa[0],pa[1]-1.55*fs.s);
    ctx.fillStyle=C.rose;ctx.fillText('Петя ↓',pp[0],pp[1]-1.55*fs.s-(Math.abs(pa[0]-pp[0])<fs.s?16:0));
    if(this.met&&t<=3.6){ctx.fillStyle=C.gold;ctx.shadowColor=C.gold;ctx.shadowBlur=14;ctx.font='700 '+Math.round(Math.max(18,fs.s*.5))+'px '+cs.getPropertyValue('--display');
      ctx.fillText('Встреча!',(pa[0]+pp[0])/2,pa[1]-2*fs.s);ctx.shadowBlur=0}
    // ---- график ----
    const f=fitR(B,-.8,6.4,-.8,8.4,30);this.axes(f,-.5,6,-.5,8.2,'минуты','ступенька');
    glow(C.sky,3);ctx.beginPath();ctx.moveTo(f.X(0),f.Y(1));ctx.lineTo(f.X(t),f.Y(ya));ctx.stroke();
    glow(C.rose,3);ctx.beginPath();ctx.moveTo(f.X(0),f.Y(7));ctx.lineTo(f.X(t),f.Y(yp));ctx.stroke();ctx.shadowBlur=0;
    for(let m=0;m<=Math.floor(t+1e-9);m++){dot(f.X(m),f.Y(m+1),4.5,C.sky);dot(f.X(m),f.Y(7-m),4.5,C.rose)}
    dot(f.X(t),f.Y(ya),6,C.fg);dot(f.X(t),f.Y(yp),6,C.fg);
    if(t>=3){const pulse=9+3*Math.sin(performance.now()/250);ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.shadowColor=C.gold;ctx.shadowBlur=16;
      ctx.beginPath();ctx.arc(f.X(3),f.Y(4),pulse,0,7);ctx.stroke();ctx.shadowBlur=0;this.label(f,3,4,'(3; 4)',C.gold,16,-16)}
    statBox.textContent='минута '+t.toFixed(1)+'   Аня: '+ya.toFixed(1)+'   Петя: '+yp.toFixed(1);
  }};

V.chaos={tab:'Игра хаоса',title:'Игра хаоса',

  badge:'Треугольник Серпинского',

  tip:'Начните с режима «По шагу»: дети видят каждый ход. Потом включите «Быстро» и спросите: «Почему не получается каша?»',
  enter(){this.speed=this.speed||'step';this.reset()},
  reset(){this.off=offscreen();this.n=0;this.acc=0;this.last=null;
    const f=fit(0,1,0,.9,40);this.f=f;this.v=[[0,0],[1,0],[.5,.866]];this.col=[C.gold,C.rose,C.sky];this.pt=[.3,.2]},
  resize(){this.reset()},

    ctlBox.append(row(btn('Начать заново',()=>this.reset())));
  },
  step(){const k=Math.floor(Math.random()*3),v=this.v[k],p=this.pt,np=[(p[0]+v[0])/2,(p[1]+v[1])/2];

    if(this.last){const L=this.last,v=this.v[L.k];
      ctx.strokeStyle=C.muted;ctx.setLineDash([4,5]);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(f.X(L.from[0]),f.Y(L.from[1]));ctx.lineTo(f.X(v[0]),f.Y(v[1]));ctx.stroke();ctx.setLineDash([]);
      dot(f.X(L.to[0]),f.Y(L.to[1]),5,this.col[L.k])}
    statBox.textContent='точек: '+this.n.toLocaleString('ru-RU');
  }};

V.fern={tab:'Папоротник',title:'Папоротник Барнсли',
  formula:'4 правила-машины.\nКаждая точка случайно\nвыбирает одно из них.',
  badge:'Папоротник из 4 правил',
  say:'Одно правило рисует стебель, три других — листья. Повторяем сто тысяч раз — и вырастает папоротник.',
  tip:'Свяжите с природой: так же устроены капуста романеско, снежинки, молнии и изрезанный берег Эстонии с сотнями островов.',
  enter(){this.reset()},
  reset(){this.off=offscreen();this.n=0;this.p=[0,0];this.f=fit(-2.8,2.9,-0.1,10.1,24)},
  resize(){this.reset()},
  setup(){ctlBox.append(row(btn('Вырастить заново',()=>this.reset())))},
  frame(){
    const c=this.off.c,f=this.f;c.fillStyle=C.leaf;
    const m=reduce?60000:1800;
    for(let i=0;i<m&&this.n<260000;i++){
      let[x,y]=this.p,r=Math.random(),nx,ny;
      if(r<.01){nx=0;ny=.16*y}
      else if(r<.86){nx=.85*x+.04*y;ny=-.04*x+.85*y+1.6}

      else{nx=-.15*x+.28*y;ny=.26*x+.24*y+.44}
      this.p=[nx,ny];this.n++;c.fillRect(f.X(nx),f.Y(ny),1,1);

    clear();ctx.drawImage(this.off.o,0,0,W,H);

  }};

V.mandel={tab:'Мандельброт',title:'Множество Мандельброта',
  formula:'z → z · z + c\nповторяем много раз',
  badge:'Нажмите на край — приблизим',
  say:'Самый знаменитый фрактал. Нажмите на любое место у края фигуры: увеличим в 4 раза, и узоры будут бесконечно новыми.',
  tip:'Формулу детям объяснять не нужно — это «вау» в конце. Пусть ученики по очереди выбирают, куда приблизить.',
  enter(){this.cx=this.cx==null?-.6:this.cx;this.cy=this.cy||0;this.z=this.z||1;this.start()},
  start(){this.w=Math.max(1,Math.floor(W));this.h=Math.max(1,Math.floor(H));
    this.off=document.createElement('canvas');this.off.width=this.w;this.off.height=this.h;
    this.oc=this.off.getContext('2d');this.oc.fillStyle=C.ink;this.oc.fillRect(0,0,this.w,this.h);
    this.img=this.oc.createImageData(this.w,1);this.y=0;this.scale=3.4/Math.min(this.w,this.h*1.3)/this.z;
    this.iter=Math.round(120+60*Math.log2(this.z))},
  resize(){this.start()},
  setup(){
    ctlBox.append(row(btn('Отдалить',()=>{this.z=Math.max(1,this.z/4);this.start()}),btn('Сначала',()=>{this.cx=-.6;this.cy=0;this.z=1;this.start()})));
  },
  click(px,py){this.cx+=(px-this.w/2)*this.scale;this.cy+=(py-this.h/2)*this.scale;this.z*=4;this.start()},
  color(t){ // ink → sky → gold → white
    const stops=[[11,18,32],[40,90,170],[92,200,255],[255,184,77],[255,244,220]];
    t=Math.max(0,Math.min(.9999,t))*(stops.length-1);const i=Math.floor(t),u=t-i,a=stops[i],b=stops[i+1];
    return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]},
  frame(){
    const t0=performance.now(),d=this.img.data,M=this.iter;
    while(this.y<this.h&&performance.now()-t0<12){
      const ci=this.cy+(this.y-this.h/2)*this.scale;
      for(let x=0;x<this.w;x++){
        const cr=this.cx+(x-this.w/2)*this.scale;let zr=0,zi=0,n=0,zr2=0,zi2=0;
        while(n<M&&zr2+zi2<16){zi=2*zr*zi+ci;zr=zr2-zi2+cr;zr2=zr*zr;zi2=zi*zi;n++}
        let rgb;if(n>=M)rgb=[11,18,32];else{const mu=n+1-Math.log(Math.log(Math.sqrt(zr2+zi2)))/Math.LN2;rgb=this.color(Math.sqrt(mu/Math.min(M,90)))}
        d[x*4]=rgb[0];d[x*4+1]=rgb[1];d[x*4+2]=rgb[2];d[x*4+3]=255;
      }
      this.oc.putImageData(this.img,0,this.y);this.y++;
    }
    clear();ctx.imageSmoothingEnabled=true;ctx.drawImage(this.off,0,0,W,H);
    statBox.textContent='увеличение: ×'+this.z.toLocaleString('ru-RU')+(this.y<this.h?'   рисую… '+Math.round(100*this.y/this.h)+'%':'');
  }};

V.butterfly={tab:'Бабочка',title:'Бабочка Фэя',
  formula:'x = sin t · (e^cos t − 2·cos 4t − sin⁵(t/12))\ny = cos t · (то же самое)',
  badge:'Бабочка',
  say:'Одна длинная формула — и точка за 12 оборотов выводит бабочку с узорами на крыльях.',
  tip:'Хорошо смотрится сразу после сердца: «Сердце было простым. А что умеет формула подлиннее?»',
  enter(){this.p=reduce?1:0},
  setup(){ctlBox.append(row(btn('Нарисовать снова',()=>this.p=0)))},
  frame(dt){
    this.p=Math.min(1,this.p+dt/7);clear();paper(32);
    const f=fit(-3.6,3.6,-2.6,4.4,30),T=12*Math.PI;
    const fn=t=>{const r=Math.exp(Math.cos(t))-2*Math.cos(4*t)-Math.pow(Math.sin(t/12),5);return[Math.sin(t)*r,Math.cos(t)*r]};
    const n=Math.round(4000*this.p),K=48;
    for(let k=0;k<K;k++){const i0=Math.floor(n*k/K),i1=Math.floor(n*(k+1)/K);if(i1<=i0)continue;
      ctx.beginPath();for(let i=i0;i<=i1;i++){const p=fn(T*i/4000);i===i0?ctx.moveTo(f.X(p[0]),f.Y(p[1])):ctx.lineTo(f.X(p[0]),f.Y(p[1]))}
      glow(grad3(k/K),1.8,8);ctx.stroke()}
    ctx.shadowBlur=0;
    if(this.p<1){const p=fn(T*this.p);dot(f.X(p[0]),f.Y(p[1]),5,C.fg)}
    statBox.textContent='оборотов: '+(6*this.p).toFixed(1)+' из 6';
  }};

V.spiro={tab:'Спирограф',title:'Спирограф',
  formula:'маленькое колесо катится\nвнутри большого,\nручка рисует узор',
  badge:'Спирограф',
  say:'Как детская игрушка с шестерёнками. Меняйте размер колеса и место ручки — получаются цветы и звёзды.',
  tip:'Спросите: почему узор замыкается? Колесо должно сделать целое число оборотов. При колесе 5 и большом круге 12 будет 12 лепестков.',
  enter(){this.r=this.r||5;this.d=this.d||4;this.t=0;this.hold=0},
  setup(){
    ctlBox.append(slider('sr','размер колеса (большой круг = 12)',1,11,1,this.r,v=>{this.r=v;this.t=0}));
    ctlBox.append(slider('sd','где ручка: расстояние от центра колеса',1,12,1,this.d,v=>{this.d=v;this.t=0}));
    ctlBox.append(row(btn('Нарисовать снова',()=>this.t=0)));
  },
  frame(dt){
    const R=12,r=this.r,d=this.d,g=(a,b)=>b?g(b,a%b):a,T=2*Math.PI*r/g(R,r);
    if(reduce)this.t=T;else if(this.t<T)this.t=Math.min(T,this.t+dt*Math.max(3,T/7));
    clear();paper(32);
    const E=R-r+d,f=fit(-Math.max(R,E)-.5,Math.max(R,E)+.5,-Math.max(R,E)-.5,Math.max(R,E)+.5,24),k=(R-r)/r;
    const fn=t=>[(R-r)*Math.cos(t)+d*Math.cos(k*t),(R-r)*Math.sin(t)-d*Math.sin(k*t)];
    ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(f.X(0),f.Y(0),R*f.s,0,7);ctx.stroke();
    const n=Math.max(2,Math.round(this.t/T*2400));curve(f,fn,0,this.t,n);glow(C.gold,2,10);ctx.stroke();ctx.shadowBlur=0;
    if(this.t<T){const cx=(R-r)*Math.cos(this.t),cy=(R-r)*Math.sin(this.t),p=fn(this.t);
      ctx.strokeStyle=C.sky;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(f.X(cx),f.Y(cy),r*f.s,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(f.X(cx),f.Y(cy));ctx.lineTo(f.X(p[0]),f.Y(p[1]));ctx.stroke();dot(f.X(p[0]),f.Y(p[1]),6,C.rose)}
    statBox.textContent='колесо '+r+', ручка '+d+'   лепестков: '+(R/g(R,r));
  }};

V.sun={tab:'Подсолнух',title:'Подсолнух и золотой угол',
  formula:'семечко № n:\n  поворот = n · 137,5°\n  расстояние = √n',
  badge:'Золотой угол 137,5°',
  say:'Каждое новое семечко поворачивается на один и тот же угол. При 137,5° семечки ложатся плотно, как в настоящем подсолнухе.',
  tip:'Подвиньте угол на 1–2 градуса: узор рассыпается на лучи. Природа «нашла» лучший угол. Посчитайте спирали — их 34 и 55, это числа Фибоначчи.',

V.koch={tab:'Снежинка Коха',title:'Снежинка Коха',
  formula:'каждый отрезок:\nделим на 3 части,\nна средней строим зубец',
  badge:'Снежинка Коха',
  say:'Повторяем одно и то же правило. Снежинка всё больше похожа на настоящую, а её граница становится бесконечно длинной.',
  tip:'Двигайте ползунок по шагу и считайте стороны вместе: 3, 12, 48… Каждый раз в 4 раза больше.',
  enter(){this.n=this.n==null?4:this.n;this.cache={}},
  setup(){ctlBox.append(slider('kn','шаг',0,6,1,this.n,v=>this.n=v))},
  pts(n){if(this.cache[n])return this.cache[n];
    let p=[[-1,-.577],[0,1.155],[1,-.577],[-1,-.577]];
    for(let s=0;s<n;s++){const q=[];for(let i=0;i<p.length-1;i++){const[a,b]=[p[i],p[i+1]],dx=(b[0]-a[0])/3,dy=(b[1]-a[1])/3,
      A=[a[0]+dx,a[1]+dy],B=[a[0]+2*dx,a[1]+2*dy],c=Math.cos(Math.PI/3),sn=Math.sin(Math.PI/3),P=[A[0]+dx*c-dy*sn,A[1]+dx*sn+dy*c];
      q.push(a,A,P,B)}q.push(p[p.length-1]);p=q}
    return this.cache[n]=p},
  frame(){
    clear();paper(32);const f=fit(-1.15,1.15,-.95,1.35,24),p=this.pts(this.n);
    ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(f.X(q[0]),f.Y(q[1])):ctx.moveTo(f.X(q[0]),f.Y(q[1])));
    ctx.globalAlpha=.14;ctx.fillStyle=C.sky;ctx.fill();ctx.globalAlpha=1;glow(C.sky,2,14);ctx.stroke();ctx.shadowBlur=0;
    statBox.textContent='шаг '+this.n+'   сторон: '+(3*Math.pow(4,this.n)).toLocaleString('ru-RU');
  }};

V.tree={tab:'Дерево',title:'Фрактальное дерево',
  formula:'ветка → две ветки\nчуть короче и под углом',
  badge:'Дерево из одного правила',

  enter(){this.ang=this.ang||28;this.k=this.k||0.72;this.t=0;this.g=reduce?1:0},
  setup(){
    ctlBox.append(slider('ta','угол ветвления, °',8,70,1,this.ang,v=>this.ang=v));
    ctlBox.append(slider('tk','насколько ветка короче',.55,.8,.01,this.k,v=>this.k=v));

  },
  frame(dt){
    this.t+=dt;this.g=Math.min(1,this.g+dt/3);clear();
    const D=11,lev=this.g*D,sway=reduce?0:Math.sin(this.t*1.2)*2.5*Math.PI/180,A=this.ang*Math.PI/180,k=this.k;
    const L0=Math.min(H*.27,W*.22);
    const br=(x,y,len,a,d)=>{if(d>lev)return;const part=Math.min(1,lev-d),x2=x+Math.sin(a)*len*part,y2=y-Math.cos(a)*len*part;
      ctx.strokeStyle=mix(C.gold,C.leaf,d/D);ctx.lineWidth=Math.max(1,(D-d)*1.1);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
      if(part>=1&&d<D){br(x2,y2,len*k,a-A+sway*(d+1)*.4,d+1);br(x2,y2,len*k,a+A+sway*(d+1)*.4,d+1)}};
    ctx.lineCap='round';br(W/2,H-16,L0,0,0);
    statBox.textContent='шагов: '+Math.min(D,Math.floor(lev)+1)+'   веточек на последнем шаге: '+Math.pow(2,Math.min(D,Math.floor(lev)));
  }};

V.dragon={tab:'Дракон',title:'Кривая дракона',
  formula:'сложи полоску бумаги\nпополам n раз и раскрой\nсгибы под прямым углом',
  badge:'Кривая дракона',
  say:'Её можно сделать руками: сложить полоску бумаги пополам несколько раз и раскрыть. Компьютер «складывает» до 15 раз.',
  tip:'Попробуйте с классом: полоска бумаги, 3–4 сгиба, раскрыть сгибы под прямым углом. Потом сравните со шагом 4 на экране.',
  enter(){this.n=this.n||11;this.p=reduce?1:0;this.cache={}},
  setup(){ctlBox.append(slider('dn','сколько раз сложили',1,15,1,this.n,v=>{this.n=v;this.p=reduce?1:0}));ctlBox.append(row(btn('Нарисовать снова',()=>this.p=0)))},
  pts(n){if(this.cache[n])return this.cache[n];let s=[];for(let i=0;i<n;i++){const r=s.slice().reverse().map(v=>-v);s=s.concat([1],r)}
    let x=0,y=0,dx=1,dy=0;const p=[[0,0],[1,0]];x=1;
    for(const v of s){[dx,dy]=v>0?[-dy,dx]:[dy,-dx];x+=dx;y+=dy;p.push([x,y])}
    let b=[1e9,-1e9,1e9,-1e9];p.forEach(q=>{b[0]=Math.min(b[0],q[0]);b[1]=Math.max(b[1],q[0]);b[2]=Math.min(b[2],q[1]);b[3]=Math.max(b[3],q[1])});
    return this.cache[n]={p,b}},
  frame(dt){
    this.p=Math.min(1,this.p+dt/4);clear();const{p,b}=this.pts(this.n),f=fit(b[0],b[1],b[2],b[3],30);
    const n=Math.max(1,Math.floor((p.length-1)*this.p)),K=40;
    for(let k=0;k<K;k++){const i0=Math.floor(n*k/K),i1=Math.floor(n*(k+1)/K);if(i1<=i0)continue;
      ctx.beginPath();ctx.moveTo(f.X(p[i0][0]),f.Y(p[i0][1]));for(let i=i0+1;i<=i1;i++)ctx.lineTo(f.X(p[i][0]),f.Y(p[i][1]));
      glow(grad3(k/K),Math.max(1.2,Math.min(4,f.s*.35)),6);ctx.stroke()}
    ctx.shadowBlur=0;statBox.textContent='сгибов: '+this.n+'   отрезков: '+(p.length-1).toLocaleString('ru-RU');
  }};

V.julia={tab:'Жюлиа',title:'Множество Жюлиа',
  formula:'z → z · z + c\nc медленно меняется',
  badge:'Живой фрактал',
  say:'Родственник Мандельброта. Мы чуть-чуть меняем одно число c, и фрактал переливается, как узор в калейдоскопе.',
  tip:'Остановите на красивом кадре и спросите, на что похоже: дракончики, морские коньки, снежинки. Каждый видит своё.',
  enter(){this.a=this.a||2.2;this.run=this.run==null?!reduce:this.run},
  setup(){ctlBox.append(row(btn(this.run?'Пауза':'Пустить',b=>{this.run=!this.run;b.textContent=this.run?'Пауза':'Пустить'})))},
  frame(dt){
    if(this.run)this.a+=dt*.12;
    const w=Math.max(1,Math.min(340,Math.floor(W/3))),h=Math.max(1,Math.round(w*H/W));
    if(!this.buf||this.buf.width!==w||this.buf.height!==h){this.buf=document.createElement('canvas');this.buf.width=w;this.buf.height=h;this.bc=this.buf.getContext('2d');this.img=this.bc.createImageData(w,h)}
    const cr=.7885*Math.cos(this.a),ci=.7885*Math.sin(this.a),d=this.img.data,sc=3.1/h,M=80;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){let zr=(x-w/2)*sc,zi=(y-h/2)*sc,n=0,zr2=zr*zr,zi2=zi*zi;
      while(n<M&&zr2+zi2<16){zi=2*zr*zi+ci;zr=zr2-zi2+cr;zr2=zr*zr;zi2=zi*zi;n++}
      const o=(y*w+x)*4;let c;if(n>=M)c=[11,18,32];else{const mu=n+1-Math.log(Math.log(Math.sqrt(zr2+zi2)))/Math.LN2;c=pal(Math.sqrt(Math.max(0,mu)/40))}
      d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}
    this.bc.putImageData(this.img,0,0);clear();ctx.imageSmoothingEnabled=true;ctx.drawImage(this.buf,0,0,W,H);
    statBox.textContent='c = '+cr.toFixed(3)+(ci<0?' − ':' + ')+Math.abs(ci).toFixed(3)+'i';
  }};

/* ---------- tabs ---------- */
const order=['heart','butterfly','rose','spiro','liss','sun','lines','chaos','koch','tree','dragon','fern','julia','mandel'];
const tabs=$('#tabs');
order.forEach(k=>{const b=document.createElement('button');b.type='button';b.role='tab';b.id='tab-'+k;b.textContent=V[k].tab;b.addEventListener('click',()=>show(k));tabs.appendChild(b)});
function show(k){
  curKey=k;cur=V[k];
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.id==='tab-'+k?'true':'false'));
  $('#title').textContent=cur.title;$('#formula').textContent=cur.formula;$('#say').textContent=cur.say;
  $('#badge').innerHTML=cur.badge;
  ctlBox.innerHTML='';statBox.textContent='';
  resize();cur.enter();cur.setup();
  try{history.replaceState(null,'','#'+k)}catch(e){}
}
cv.addEventListener('click',e=>{if(cur&&cur.click){const r=cv.getBoundingClientRect();cur.click(e.clientX-r.left,e.clientY-r.top)}});
$('#fs').addEventListener('click',()=>{const s=$('#stage');
  if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen().catch(()=>{})}
  else if(s.requestFullscreen){s.requestFullscreen().catch(()=>{})}});
document.addEventListener('fullscreenchange',()=>{$('#fs').textContent=document.fullscreenElement?'Выйти':'На весь экран'});

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(cur)cur.frame(dt);requestAnimationFrame(loop)}
const h=(location.hash||'').slice(1);
show(order.includes(h)?h:'heart');
requestAnimationFrame(loop);
})();
</script>
